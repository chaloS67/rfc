<h1>Noticias</h1>

{% for noticia in noticias %}

    <article>
        <h2>{{ noticia.titulo }}</h2>

        <p>{{ noticia.fecha_publicacion }}</p>

        {% if noticia.imagen %}
            <img src="{{ noticia.imagen.url }}" alt="{{ noticia.titulo }}" width="300">
        {% endif %}

        <p>{{ noticia.contenido }}</p>
    </article>

{% empty %}

    <p>No hay noticias publicadas.</p>

{% endfor %}
