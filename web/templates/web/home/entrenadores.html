{% load static %}

<section id="entrenadores" class="home-entrenadores">
    <div class="container">

        <img
            class="entrenadores-titulo"
            src="{% static 'web/img/titulos/profesores.png' %}"
            alt="Nuestros profesores">

        <div class="entrenadores-wrapper">

            <button
                class="entrenadores-flecha entrenadores-flecha-izq"
                id="entrenadores-prev"
                type="button">
                ‹
            </button>

            <div class="entrenadores-carousel" id="entrenadores-carousel">

                {% for entrenador in entrenadores %}
                    <article 
                        class="entrenador-card entrenador-card-clickable"
                        data-nombre="{{ entrenador.nombre }}"
                        data-disciplina="{{ entrenador.disciplina }}"
                        data-dias="{{ entrenador.dias|default:'' }}"
                        data-horarios="{{ entrenador.horarios|default:'' }}"
                        data-foto="{% if entrenador.foto %}{{ entrenador.foto.url }}{% endif %}">

                        {% if entrenador.foto %}
                            <img
                                src="{{ entrenador.foto.url }}"
                                alt="{{ entrenador.nombre }}">
                        {% endif %}

                        <!-- Indicador visual sutil de que es clickeable -->
                        <div class="entrenador-ver-mas">
                            <span>Ver horarios y días</span>
                        </div>

                    </article>
                {% empty %}
                    <p style="color: #aaa; text-align: center; width: 100%; padding: 20px;">
                        Próximamente entrenadores y horarios.
                    </p>
                {% endfor %}

            </div>

            <button
                class="entrenadores-flecha entrenadores-flecha-der"
                id="entrenadores-next"
                type="button">
                ›
            </button>

        </div>

    </div>

    <!-- VENTANA MODAL (POP-UP) -->
    <div id="entrenador-modal" class="modal-rfc-overlay" style="display: none;">
        <div class="modal-rfc-contenido">
            <button class="modal-rfc-cerrar" id="modal-cerrar-btn" type="button">&times;</button>
            
            <div class="modal-rfc-cuerpo">
                <div class="modal-rfc-img-wrap">
                    <img id="modal-profe-img" src="" alt="Profesor">
                </div>
                
                <div class="modal-rfc-info">
                    <h3 id="modal-profe-nombre"></h3>
                    <span id="modal-profe-disciplina" class="badge-disciplina"></span>

                    <div class="modal-rfc-bloque">
                        <p class="modal-linea">
                            <strong>Días:</strong> <span id="modal-profe-dias"></span>
                        </p>
                        <p class="modal-linea">
                            <strong>Horarios:</strong> <span id="modal-profe-horarios"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
